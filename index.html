<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Day & Analytics Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="hub-container">
    <!-- Шапка матча -->
    <header class="match-header">
      <div class="team">
        <i class="fa-solid fa-shield-cat team-logo"></i>
        <h2>CYBER FC</h2>
      </div>
      <div class="score-board">
        <span class="live-badge">LIVE 78'</span>
        <div class="score">2 : 1</div>
        <span class="stadium">Cyber Arena</span>
      </div>
      <div class="team">
        <i class="fa-solid fa-dragon team-logo opponent"></i>
        <h2>NEON CITY</h2>
      </div>
    </header>

    <div class="content-grid">
      <!-- Тактическая схема (Поле) -->
      <section class="tactics-section">
        <div class="tactics-header">
          <h3>Тактическая схема</h3>
          <div class="tactics-selector">
            <button class="tactic-btn active" onclick="changeFormation('433')">4-3-3</button>
            <button class="tactic-btn" onclick="changeFormation('4231')">4-2-3-1</button>
          </div>
        </div>

        <div class="pitch" id="pitch">
          <!-- Игроки генерируются через JS -->
        </div>
      </section>

      <!-- Правая панель: Статистика матча -->
      <aside class="stats-section">
        <h3>Статистика матча</h3>
        
        <div class="stat-item">
          <div class="stat-labels">
            <span>62%</span>
            <span>Владение мячом</span>
            <span>38%</span>
          </div>
          <div class="bar-container">
            <div class="bar fill-home" style="width: 62%;"></div>
            <div class="bar fill-away" style="width: 38%;"></div>
          </div>
        </div>

        <div class="stat-item">
          <div class="stat-labels">
            <span>14</span>
            <span>Удары по воротам</span>
            <span>8</span>
          </div>
          <div class="bar-container">
            <div class="bar fill-home" style="width: 63%;"></div>
            <div class="bar fill-away" style="width: 37%;"></div>
          </div>
        </div>

        <div class="stat-item">
          <div class="stat-labels">
            <span>89%</span>
            <span>Точность передач</span>
            <span>79%</span>
          </div>
          <div class="bar-container">
            <div class="bar fill-home" style="width: 53%;"></div>
            <div class="bar fill-away" style="width: 47%;"></div>
          </div>
        </div>

        <!-- Ключевые игроки -->
        <h3 style="margin-top: 30px;">Игрок матча</h3>
        <div class="mvp-card">
          <div class="player-avatar"><i class="fa-solid fa-user-ninja"></i></div>
          <div class="mvp-info">
            <h4>Дамирлан Кушекбай</h4>
            <p>Полузащитник (№10)</p>
            <span class="rating">Рейтинг: 9.4</span>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
